name: 公開データの検証
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: rustup toolchain install 1.90.0 --profile minimal
      - run: python scripts/build_runtime.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 統合生成ツール
          path: |
            .local/runtime/GeneratePatch.exe
            .local/runtime/RUNTIME_LICENSES.txt
            .local/runtime/runtime-build.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  validate:
    needs: runtime
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: 統合生成ツール
          path: .local/runtime
      - run: python scripts/check_public.py
      - run: python scripts/check_public.py --history
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_translations.py
      - run: python scripts/build.py
      - run: python scripts/check_reproducible.py --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: 配布候補-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
  compare:
    name: 環境間の配布物一致
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: 配布候補-*
          path: .local/candidates
      - run: python scripts/compare_artifacts.py .local/candidates/配布候補-windows-latest .local/candidates/配布候補-ubuntu-latest
